cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
authors = ["curry <VanishingDante@gmail.com>"]
edition = "2024"
forced-target = "riscv64imac-unknown-none-elf"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
abi = { path = "../abi" }
hello = { path = "../../user/hello", artifact = "bin", target = "riscv64imac-unknown-none-elf" }
fdt-raw = "0.3.0"
frame-allocator = { path = "../frame-allocator" }
buddy-heap = { path = "../buddy-heap" }
heapless = "0.9"
mmu = { path = "../mmu" }
riscv = "0.16.0"
sbi-rt = "0.0.4"
sbi-spec = "0.0.9"
spin = "0.10.0"
uart_16550 = "0.4"
elf = { version = "0.8.0", default-features = false }

