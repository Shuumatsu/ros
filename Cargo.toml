[workspace]
members = [
    "crates/mmu",
    "crates/kernel",
    "crates/blockdev",
    "crates/rfs",
    "crates/mkfs",
    "crates/frame-allocator",
    "crates/buddy-heap",
    "user/hello",
]
resolver = "3"

[profile.dev]
debug = true
panic = "abort"

[profile.release]
debug = true
panic = "abort"
