[alias]
# `cargo krun` boots the kernel in QEMU; `cargo kbuild` just builds it.
#
# Both carry --target because it is what selects the runner. The kernel's
# per-package `forced-target` drives the *build* alone, so `cargo run` without
# --target builds the riscv ELF and then tries to exec it on the host, dying with
# "cannot execute binary file". Spelling the target out makes cargo resolve the
# [target.riscv64imac-unknown-none-elf].runner below.
#
# The alternative, a global [build] target, would force `mmu`'s host unit tests
# onto the riscv target too and break `cargo test -p mmu`.
krun = "run -p kernel --target riscv64imac-unknown-none-elf"
kbuild = "build -p kernel --target riscv64imac-unknown-none-elf"

# The crates that test on the host. `kernel` and the user programs are excluded because their
# `forced-target` has no `test` crate; naming them here keeps the list in one place.
test-host = "test --workspace --exclude kernel --exclude hello"

[target.riscv64imac-unknown-none-elf]
# https://doc.rust-lang.org/nightly/rustc/platform-support.html
# Target: RISC-V 64-bit, I+M+A+C extensions, bare metal, no OS.
#
# Compressed instructions are on, so instruction widths vary: boot assembly that counts
# bytes says `.option norvc` itself (see `arch::riscv64::boot::asm`). Turning RVC off takes
# `-Ctarget-feature=-c,-zca`, since this target implies `zca` and `zca` is what emits the
# compressed integer forms.
# The kernel selects its architecture with `cfg(target_arch = "riscv64")`, which this
# target implies.
#
# No `rustflags` here. Settings in this table reach every crate built for the target, and the
# user programs under `user/` share it with the kernel while needing linker scripts of their
# own, so each binary names its script from its own `build.rs`.
# Boot the kernel as a flat RISC-V Image (objcopy'd from the ELF) under OpenSBI.
# scripts/run.sh does the objcopy + QEMU launch and holds the QEMU options;
# cargo appends the built ELF path as the script's argument.
runner = "bash scripts/run.sh"
